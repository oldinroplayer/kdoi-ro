<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDoiRo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud" hidden>
      <div class="hud-card">
        <div class="hud-row">
          <div id="hud-name"></div>
          <span id="bot-badge" class="bot-badge" title="Auto attack is on (Alt+B to stop)" hidden>AUTO</span>
        </div>
        <div id="hud-level" class="hud-sub"></div>
        <div id="hp-bar" class="bar hp" role="meter" aria-label="HP" aria-valuemin="0">
          <div class="bar-fill"></div>
          <span class="bar-text"></span>
        </div>
        <div id="sp-bar" class="bar sp" role="meter" aria-label="SP" aria-valuemin="0">
          <div class="bar-fill"></div>
          <span class="bar-text"></span>
        </div>
        <div id="base-exp" class="bar exp" role="meter" aria-label="Base EXP" aria-valuemin="0">
          <div class="bar-fill"></div>
          <span class="bar-text"></span>
        </div>
        <div id="job-exp" class="bar exp job" role="meter" aria-label="Job EXP" aria-valuemin="0">
          <div class="bar-fill"></div>
          <span class="bar-text"></span>
        </div>
        <div class="hud-row">
          <span id="hud-pos" class="hud-sub"></span>
          <span id="hud-zeny" class="hud-zeny"></span>
        </div>
        <div id="buffs" class="buffs" aria-label="Buffs" hidden></div>
      </div>
      <div class="hud-right">
      <div class="hud-menu">
        <button id="menu-button" class="menu-button" type="button" aria-haspopup="menu" aria-expanded="false"
                aria-controls="menu" title="Menu (Esc)">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Menu
        </button>
        <div id="menu" class="menu" role="menu" hidden>
          <button id="menu-inventory" type="button" role="menuitem">Inventory <kbd>Alt+E</kbd></button>
          <button id="menu-equipment" type="button" role="menuitem">Equipment <kbd>Alt+Q</kbd></button>
          <button id="menu-status" type="button" role="menuitem">Status <kbd>Alt+A</kbd></button>
          <button id="menu-skills" type="button" role="menuitem">Skills <kbd>Alt+S</kbd></button>
          <button id="menu-sit" type="button" role="menuitem">Sit / Stand <kbd>Insert</kbd></button>
          <button id="menu-room" type="button" role="menuitem">Chat Room <kbd>Alt+C</kbd></button>
          <button id="menu-party" type="button" role="menuitem">Party <kbd>Alt+Z</kbd></button>
          <button id="menu-hair" type="button" role="menuitem">Appearance</button>
          <button id="menu-bot" type="button" role="menuitem">Auto Attack <kbd>Alt+B</kbd></button>
          <button id="menu-sound" type="button" role="menuitem">Sound</button>
          <hr />
          <button id="logout-button" type="button" role="menuitem">Log out</button>
        </div>
      </div>
      <div id="minimap"></div>
      </div>
      <div id="chat" class="chat">
        <div class="chat-log" role="log" aria-live="polite" aria-label="Chat"></div>
        <form class="chat-form">
          <input type="text" maxlength="120" autocomplete="off" aria-label="Chat message"
                 placeholder="Enter to chat · /w Name message to whisper" />
        </form>
      </div>
    </div>

    <div id="death" class="death" role="alertdialog" aria-labelledby="death-title" hidden>
      <div class="panel death-panel">
        <h2 id="death-title">You have been knocked out</h2>
        <p class="subtitle">You'll wake up at your save point with half your HP.</p>
        <button id="respawn-button" type="button">Return to Save Point</button>
      </div>
    </div>

    <div id="hotbar"></div>
    <div id="windows"></div>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="toasts" aria-live="polite"></div>

    <div id="status" hidden></div>

    <div id="login" class="overlay">
      <form id="login-form" class="panel" autocomplete="on">
        <h1>KDoiRo</h1>
        <p class="subtitle">Enter a character name. New names are created as a Novice outside Payon Cave.</p>
        <div id="server-stats" class="server-stats" aria-live="polite">
          <span class="stat-status"><span class="stat-dot" aria-hidden="true"></span><span id="stat-online">Checking server…</span></span>
          <span class="stat"><span class="stat-label">EXP</span> <strong id="stat-exp">–</strong></span>
          <span class="stat"><span class="stat-label">Drop</span> <strong id="stat-drop">–</strong></span>
        </div>
        <label>
          Character name
          <input id="name" name="username" autocomplete="username" required minlength="4" maxlength="23"
                 pattern="[A-Za-z0-9_]+" title="4–23 letters, digits or underscores" />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 minlength="4" maxlength="72" />
        </label>
        <details>
          <summary>Server</summary>
          <input id="server" value="ws://localhost:7000/ws" spellcheck="false" />
        </details>
        <p id="login-error" role="alert"></p>
        <button id="login-button" type="submit">Enter</button>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
